<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Algebra I Practice · The Math Final Girl</title>
<meta content="Practice Algebra I with simple exercises and instant answer checking." name="description"/>
<meta content="Pierre C. Renschler" name="author"/>
<style>
    :root {
      --paper: #ffffff;
      --grid: rgba(75, 120, 170, 0.12);
      --ink: #161616;
      --muted: #666666;
      --math: #f3c623;
      --math-dark: #c99a00;
      --panel: rgba(255, 255, 255, 0.95);
      --border: #d8d8d8;
      --correct: #167a36;
      --wrong: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .container {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .home-link {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }

    .series-logo {
      width: min(330px, 58vw);
      height: auto;
      display: block;
      background: #000;
      border-radius: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 8px solid var(--math);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    h1, h2 {
      margin-top: 0;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(34px, 7vw, 54px);
    }

    .intro {
      max-width: 650px;
      margin: 0 auto;
      text-align: center;
      color: var(--muted);
      line-height: 1.55;
      font-size: 18px;
    }

    .topic-grid,
    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    button { font: inherit; }

    .topic-button,
    .exercise-button,
    .action-button {
      width: 100%;
      min-height: 58px;
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .topic-button {
      color: #111;
      background: var(--math);
      border: 2px solid var(--math-dark);
      box-shadow: 0 4px 0 var(--math-dark);
    }

    .topic-button.active {
      outline: 4px solid rgba(243, 198, 35, 0.28);
    }

    .exercise-button {
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--ink);
    }

    .exercise-button:disabled {
      color: #8a8a8a;
      border-color: #bdbdbd;
      background: #f5f5f5;
      cursor: not-allowed;
    }

    .exercise-button.active {
      background: #111;
      color: white;
    }

    .is-hidden { display: none; }

    .problem {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      margin: 18px 0;
      border: 2px solid var(--ink);
      border-radius: 16px;
      background: white;
      font-size: clamp(30px, 8vw, 50px);
      font-weight: 700;
      text-align: center;
    }

    .answer-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
    }

    .answer-input {
      width: 100%;
      min-height: 58px;
      padding: 12px 14px;
      border: 2px solid var(--ink);
      border-radius: 14px;
      font-size: 22px;
      text-align: center;
    }

    .action-button {
      color: #111;
      background: var(--math);
      border: 2px solid var(--math-dark);
    }

    .secondary-action {
      margin-top: 12px;
      background: #fff;
      border: 2px solid var(--ink);
      color: var(--ink);
    }

    .feedback {
      min-height: 34px;
      margin-top: 16px;
      text-align: center;
      font-size: 21px;
      font-weight: 700;
    }

    .feedback.correct { color: var(--correct); }
    .feedback.incorrect { color: var(--wrong); }

    .small-note {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .back-button {
      display: inline-block;
      margin-top: 6px;
      color: var(--ink);
      font-weight: 700;
    }


    .category {
      padding: 18px;
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
    }

    .category:first-of-type { margin-top: 0; }

    .category h3 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .mixed-practice {
      color: #111;
      background: var(--math);
      border-color: var(--math-dark);
      box-shadow: 0 4px 0 var(--math-dark);
    }

    .mixed-practice.active {
      color: #fff;
      background: #111;
      border-color: #111;
      box-shadow: none;
    }

    #algebra-visual,
    #algebra-question,
    #algebra-example { text-align: center; }

    #algebra-question {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 700;
    }

    #algebra-example {
      margin-top: 8px;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 15px;
    }

    @media (max-width: 650px) {
      .container {
        width: min(100% - 18px, 920px);
        padding-top: 12px;
      }

      .topbar { align-items: flex-start; }
      .panel { padding: 18px 14px; }

      .topic-grid,
      .exercise-grid,
      .answer-row {
        grid-template-columns: 1fr;
      }

      .series-logo { width: 220px; }
    }
  </style>
</head>
<body>
<main class="container">
<div class="topbar">
<a class="home-link" href="index.html">← Home</a>
<a aria-label="Final Girl series home" href="index.html">
<img alt="Final Girl series — Survive school easily" class="series-logo" src="finalgirl.png"/>
</a>
</div>
<section class="panel">
<h1>Algebra I</h1>
<p class="intro">Choose an exercise, solve the problem and check your answer.</p>
</section>
<section class="panel" id="exercisePanel"><h2>Choose an exercise</h2><section class="category"><h3>Expressions</h3><div class="exercise-grid"><button class="exercise-button" data-algebra-generator="1" type="button">Evaluate an expression</button><button class="exercise-button" data-algebra-generator="2" type="button">Combine like terms</button><button class="exercise-button" data-algebra-generator="3" type="button">Expand brackets</button><button class="exercise-button" data-algebra-generator="4" type="button">Factor out the greatest common factor</button></div></section><section class="category"><h3>Linear Equations</h3><div class="exercise-grid"><button class="exercise-button" data-algebra-generator="5" type="button">One-step equations</button><button class="exercise-button" data-algebra-generator="6" type="button">Two-step equations</button><button class="exercise-button" data-algebra-generator="7" type="button">Variables on both sides</button><button class="exercise-button" data-algebra-generator="8" type="button">Equations with fractions</button></div></section><section class="category"><h3>Inequalities</h3><div class="exercise-grid"><button class="exercise-button" data-algebra-generator="9" type="button">One-step inequalities</button><button class="exercise-button" data-algebra-generator="10" type="button">Two-step inequalities</button><button class="exercise-button" data-algebra-generator="11" type="button">Compound inequalities</button><button class="exercise-button" data-algebra-generator="12" type="button">Word problems with inequalities</button></div></section><section class="category"><h3>Functions &amp; Coordinates</h3><div class="exercise-grid"><button class="exercise-button" data-algebra-generator="13" type="button">Evaluate a function</button><button class="exercise-button" data-algebra-generator="14" type="button">Find the missing function value</button><button class="exercise-button" data-algebra-generator="15" type="button">Slope from two points</button><button class="exercise-button" data-algebra-generator="16" type="button">Slope-intercept form</button></div></section><section class="category"><h3>Applications</h3><div class="exercise-grid"><button class="exercise-button" data-algebra-generator="17" type="button">Word equations</button><button class="exercise-button" data-algebra-generator="18" type="button">Consecutive number problems</button><button class="exercise-button" data-algebra-generator="19" type="button">Formula rearrangement</button><button class="exercise-button" data-algebra-generator="20" type="button">Mixed algebra word problems</button></div></section><section class="category"><h3>Mixed Practice</h3><button class="exercise-button mixed-practice" data-algebra-mixed-practice="" type="button">Mixed Practice</button></section><p class="small-note">All 20 exercises are active.</p></section>
<section class="panel practice-area is-hidden" id="algebra-exercise-area">
<h2 id="algebra-exercise-title">Practice</h2>
<div class="problem" id="algebra-problem">Choose an exercise first.</div><div id="algebra-visual"></div><div id="algebra-question"></div><div id="algebra-example"></div>
<div class="answer-row">
<input aria-label="Your answer" autocomplete="off" class="answer-input" id="algebra-answer" inputmode="text" placeholder="Your answer" type="text"/>
<button class="action-button" id="algebra-check-answer" type="button">Check answer</button>
</div>
<button class="action-button secondary-action" id="algebra-new-problem" type="button">New problem</button>
<div aria-live="polite" class="feedback" id="algebra-feedback"></div>
</section>
<a class="back-button" href="index.html">← Back to Math Final Girl</a>
</main>
<script src="js/algebra.js"></script>
</body>
</html>
