<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fractions Practice · The Math Final Girl</title>
<meta content="Practice fractions with simple exercises and instant answer checking." name="description"/>
<meta content="Pierre C. Renschler" name="author"/>
<style>
    :root {
      --paper: #ffffff;
      --grid: rgba(75, 120, 170, 0.12);
      --ink: #161616;
      --muted: #666666;
      --math: #f3c623;
      --math-dark: #c99a00;
      --panel: rgba(255, 255, 255, 0.95);
      --border: #d8d8d8;
      --correct: #167a36;
      --wrong: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .container {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .home-link {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }

    .series-logo {
      width: min(330px, 58vw);
      height: auto;
      display: block;
      background: #000;
      border-radius: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 8px solid var(--math);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    h1, h2 {
      margin-top: 0;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(34px, 7vw, 54px);
    }

    .intro {
      max-width: 650px;
      margin: 0 auto;
      text-align: center;
      color: var(--muted);
      line-height: 1.55;
      font-size: 18px;
    }

    .topic-grid,
    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    button { font: inherit; }

    .topic-button,
    .exercise-button,
    .action-button {
      width: 100%;
      min-height: 58px;
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .topic-button {
      color: #111;
      background: var(--math);
      border: 2px solid var(--math-dark);
      box-shadow: 0 4px 0 var(--math-dark);
    }

    .topic-button.active {
      outline: 4px solid rgba(243, 198, 35, 0.28);
    }

    .exercise-button {
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--ink);
    }

    .exercise-button:disabled {
      color: #8a8a8a;
      border-color: #bdbdbd;
      background: #f5f5f5;
      cursor: not-allowed;
    }

    .exercise-button.active {
      background: #111;
      color: white;
    }

    .practice-area { display: none; }

    .problem {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      margin: 18px 0;
      border: 2px solid var(--ink);
      border-radius: 16px;
      background: white;
      font-size: clamp(30px, 8vw, 50px);
      font-weight: 700;
      text-align: center;
    }

    .answer-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
    }

    .answer-input {
      width: 100%;
      min-height: 58px;
      padding: 12px 14px;
      border: 2px solid var(--ink);
      border-radius: 14px;
      font-size: 22px;
      text-align: center;
    }

    .action-button {
      color: #111;
      background: var(--math);
      border: 2px solid var(--math-dark);
    }

    .secondary-action {
      margin-top: 12px;
      background: #fff;
      border: 2px solid var(--ink);
      color: var(--ink);
    }

    .feedback {
      min-height: 34px;
      margin-top: 16px;
      text-align: center;
      font-size: 21px;
      font-weight: 700;
    }

    .feedback.correct { color: var(--correct); }
    .feedback.wrong { color: var(--wrong); }

    .small-note {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .back-button {
      display: inline-block;
      margin-top: 6px;
      color: var(--ink);
      font-weight: 700;
    }

    @media (max-width: 650px) {
      .container {
        width: min(100% - 18px, 920px);
        padding-top: 12px;
      }

      .topbar { align-items: flex-start; }
      .panel { padding: 18px 14px; }

      .topic-grid,
      .exercise-grid,
      .answer-row {
        grid-template-columns: 1fr;
      }

      .series-logo { width: 220px; }
    }
  </style>
</head>
<body>
<main class="container">
<div class="topbar">
<a class="home-link" href="index.html">← Home</a>
<a aria-label="Final Girl series home" href="index.html">
<img alt="Final Girl series — Survive school easily" class="series-logo" src="finalgirl.png"/>
</a>
</div>
<section class="panel">
<h1>Fractions</h1>
<p class="intro">
        Choose a topic, choose an exercise, solve the problem and check your answer.
      </p>
</section>
<section class="panel" id="topicPanel">
<h2>Choose a topic</h2>
<div class="topic-grid" id="topicButtons"></div>
</section>
<section class="panel" hidden="" id="exercisePanel">
<h2 id="exerciseHeading">Choose an exercise</h2>
<div class="exercise-grid" id="exerciseButtons"><button class="exercise-button" data-fraction-generator="1" type="button">01. Identify the fraction</button><button class="exercise-button" data-fraction-generator="2" type="button">02. Numerator or denominator</button><button class="exercise-button" data-fraction-generator="3" type="button">03. Equivalent fractions</button><button class="exercise-button" data-fraction-generator="4" type="button">04. Simplify a fraction</button><button class="exercise-button" data-fraction-generator="5" type="button">05. Compare: same denominator</button><button class="exercise-button" data-fraction-generator="6" type="button">06. Compare: same numerator</button><button class="exercise-button" data-fraction-generator="7" type="button">07. Compare: different fractions</button><button class="exercise-button" data-fraction-generator="8" type="button">08. Order three fractions</button><button class="exercise-button" data-fraction-generator="9" type="button">09. Add: same denominator</button><button class="exercise-button" data-fraction-generator="10" type="button">10. Subtract: same denominator</button><button class="exercise-button" data-fraction-generator="11" type="button">11. Add: different denominators</button><button class="exercise-button" data-fraction-generator="12" type="button">12. Subtract: different denominators</button><button class="exercise-button" data-fraction-generator="13" type="button">13. Add three fractions</button><button class="exercise-button" data-fraction-generator="14" type="button">14. Whole number × fraction</button><button class="exercise-button" data-fraction-generator="15" type="button">15. Multiply two fractions</button><button class="exercise-button" data-fraction-generator="16" type="button">16. Fraction ÷ whole number</button><button class="exercise-button" data-fraction-generator="17" type="button">17. Divide two fractions</button><button class="exercise-button" data-fraction-generator="18" type="button">18. Improper → mixed number</button><button class="exercise-button" data-fraction-generator="19" type="button">19. Mixed → improper</button><button class="exercise-button" data-fraction-generator="20" type="button">20. Fraction of a quantity</button><button class="exercise-button" data-fraction-mixed-practice="" type="button">Mixed Practice</button></div>
<p class="small-note">Grey exercises are planned but not active yet.</p>
</section>
<section class="panel is-hidden" id="fraction-exercise-area">
<h2 id="fraction-exercise-title">Practice</h2>
<div class="problem" id="fraction-problem">Choose an exercise first.</div><div id="fraction-visual"></div><div id="fraction-question"></div><div id="fraction-example"></div>
<div class="answer-row">
<input aria-label="Your answer" autocomplete="off" class="answer-input" id="fraction-answer" inputmode="text" placeholder="Your answer" type="text"/>
<button class="action-button" id="fraction-check-answer" type="button">Check answer</button>
</div>
<button class="action-button secondary-action" id="fraction-new-problem" type="button">New problem</button>
<div aria-live="polite" class="feedback" id="fraction-feedback"></div>
</section>
<a class="back-button" href="index.html">← Back to Math Final Girl</a>
</main>
<script src="js/fractions.js"></script>
</body>
</html>
